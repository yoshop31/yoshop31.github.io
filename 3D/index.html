<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Anaglyphe 3D</title>
  <meta name="msapplication-TileColor" content="#af0a1a">
  <meta name="theme-color" content="#ffffff">
  <!--debut no cache-->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!--fin no cache-->
  <link rel="shortcut icon" href="img/fav_icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/fav_icon.png">
  <link rel="manifest" href="pwa-manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script type='text/javascript' src="js/main.js"></script>
  <style>
    .hidden { display: none; }
    .content { text-align: center; margin-top: 20px; }
    .camera-container { position: relative; display: inline-block; }
    video, canvas { max-width: 100%; margin-top: 10px; border: none; } 
    #gridCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    button { margin: 10px; padding: 10px 15px; font-size: 16px; }
	.button_up_down { margin: 3px; padding: 3px 3px; font-size: 16px; }
    input[type=range] { margin: 0px; padding: 0px 0px; font-size: 16px; width:160px; }
    .fade-out { opacity: 0; transition: opacity 0.3s ease-in-out; }
    .fade-in { opacity: 1; transition: opacity 0.3s ease-in-out; }
    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }
    #rotationLabel, #offsetYLabel, #offsetLabel { display: block; }
  </style>
</head>
<body>
  <div id="flash" class="hidden"></div>

  <div id="home" class="content">
    <h1>Anaglyphe 3D</h1>
    <h3>v20</h3>
    <!--<span id="welcomePanel" /*class="hidden"*/>-->
      <button onclick="openCamera()">Prendre 2 photos</button>
  	  <button onclick="importPhotos()">Importer 2 photos</button>
    <!--</span>-->
	<input type="file" id="photoInput" accept="image/*" multiple class="hidden">
    
  </div>

  <div id="cameraPage" class="content hidden">
    <h2 id="stepTitle">Photo gauche</h2>
    <div class="camera-container">
      <video id="camera" autoplay playsinline class="fade-in"></video>
      <canvas id="gridCanvas" class="hidden"></canvas><!--la grille-->
      <canvas id="photoLeft" class="hidden"></canvas>
      <canvas id="photoRight" class="hidden"></canvas>
      <canvas id="anaglyphCanvas" class="hidden"></canvas>
    </div>
    <br>
    <span id="offsetPanel" class="hidden">
      <label id="offsetLabel" >X: <span id="offsetValue">0</span> %
		<button class="button_up_down" onclick="nudge('x', -1)">-</button>
      	<input type="range" id="offsetSlider" min="-30" max="30" value="0" oninput="updateAnaglyph()">
		<button class="button_up_down" onclick="nudge('x', 1)">+</button>
      </label>
      <label id="offsetYLabel" >Y: <span id="offsetYValue">0</span> %
      	<button class="button_up_down" onclick="nudge('y', -1)">-</button>
		<input type="range" id="offsetYSlider" min="-30" max="30" value="0" oninput="updateAnaglyph()">    
		<button class="button_up_down" onclick="nudge('y', 1)">+</button>
      </label>
      <label id="rotationLabel" >Rot: <span id="rotationValue">0</span>°
      	<button class="button_up_down" onclick="nudge('r', -1)">-</button>
		<input type="range" id="rotationSlider" min="-20" max="20" value="0" oninput="updateAnaglyph()">
		<button class="button_up_down" onclick="nudge('r', 1)">+</button>
      </label>
      <button id="resetBtn" onclick="resetTransform()">Réinitialiser</button>
      <br>
      <button id="invertBtn" onclick="invertChannels()">Inverser Rouge/Cyan</button>  
      <button id="downloadBtn" onclick="downloadAnaglyph()">Télécharger</button>
	  <button id="cropBtn" onclick="cropAndDownload()">Crop et Télécharge</button>
	  <br>
  	  <button id="saveSourcesBtn" onclick="downloadSources1()">Save sources1</button>
	  <button id="saveSourcesBtn" onclick="downloadSources2()">Save sources2</button>
    </span>
    <button id="gridBtn" class="hidden" onclick="toggleGrid()">Grille</button>
    <button id="captureBtn" class="hidden" onclick="takePhoto()">Prendre</button>
    <button onclick="backHome()">Retour</button>
  </div>

  <script>
    const home = document.getElementById('home');
    const cameraPage = document.getElementById('cameraPage');
    const camera = document.getElementById('camera');
    const gridCanvas = document.getElementById('gridCanvas');
    const photoLeft = document.getElementById('photoLeft');
    const photoRight = document.getElementById('photoRight');
    const anaglyphCanvas = document.getElementById('anaglyphCanvas');
    const slider = document.getElementById('offsetSlider');
    const offsetLabel = document.getElementById('offsetLabel');
    const offsetValue = document.getElementById('offsetValue');
    const stepTitle = document.getElementById('stepTitle');
    const invertBtn = document.getElementById('invertBtn');
    const offsetYSlider = document.getElementById('offsetYSlider');
    const rotationSlider = document.getElementById('rotationSlider');
    const offsetYLabel = document.getElementById('offsetYLabel');
    const rotationLabel = document.getElementById('rotationLabel');
    const offsetYValue = document.getElementById('offsetYValue');
    const rotationValue = document.getElementById('rotationValue');
    const resetBtn = document.getElementById('resetBtn');
    const offsetPanel = document.getElementById('offsetPanel');
    const welcomePanel = document.getElementById('welcomePanel');
	const cropBtn = document.getElementById('cropBtn');


    let stream = null;
    let cameras = [];
    let currentCam = 0;
    let startY = 0;
    let offset = 0;
    let offsetY = 0;
    let rotation = 0;
    let step = 1;
    let leftImgData = null, rightImgData = null;
    let invert = false; // Rouge = gauche, Cyan = droite
    let showGrid = false;

    function triggerFlash() {
      const flash = document.getElementById('flash');
      flash.classList.remove('hidden');
      flash.style.opacity = 1;
      setTimeout(() => {
        flash.style.opacity = 0;
      }, 100); // le flash disparaît vite
    }

    async function openCamera() {
      home.classList.add('hidden');
      cameraPage.classList.remove('hidden');
      await loadCameras();
      startCamera(cameras[currentCam]?.deviceId);
      step = 1;
      stepTitle.textContent = "Photo gauche";
    }

    function backHome() {
      stopCamera();
      cameraPage.classList.add('hidden');
      home.classList.remove('hidden');
      anaglyphCanvas.classList.add('hidden');
      /*slider.classList.add('hidden');
      offsetLabel.classList.add('hidden');
      offsetYLabel.classList.add('hidden');
      offsetYSlider.classList.add('hidden');
      rotationLabel.classList.add('hidden');
      rotationSlider.classList.add('hidden');
      resetBtn.classList.add('hidden');*/
      offsetPanel.classList.add('hidden');
      /*invertBtn.classList.add('hidden');
      downloadBtn.classList.add('hidden');*/
      captureBtn.classList.remove('hidden');
      gridBtn.classList.remove('hidden');
      gridCanvas.classList.add('hidden');
      step = 1;
    }

    async function loadCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      cameras = devices.filter(d => d.kind === 'videoinput');
      const backCamIndex = cameras.findIndex(c => c.label.toLowerCase().includes('back'));
      if (backCamIndex >= 0) currentCam = backCamIndex;
    }

    async function startCamera(deviceId) {
      if (stream) stopCamera();
      try {
        camera.classList.add('fade-out');
        setTimeout(async () => {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: deviceId } }
          });
          camera.srcObject = stream;
          camera.classList.remove('fade-out');
          camera.classList.add('fade-in');
          camera.classList.remove('hidden');
          anaglyphCanvas.classList.add('hidden');
          /*slider.classList.add('hidden');
          offsetLabel.classList.add('hidden');
          offsetYLabel.classList.add('hidden');
          offsetYSlider.classList.add('hidden');
          rotationLabel.classList.add('hidden');
          rotationSlider.classList.add('hidden');
          resetBtn.classList.add('hidden');*/
          offsetPanel.classList.add('hidden');
          /*invertBtn.classList.add('hidden');
          downloadBtn.classList.add('hidden');*/
          captureBtn.classList.remove('hidden');
          gridBtn.classList.remove('hidden');
          gridCanvas.classList.add('hidden');
          showGrid = false;
        }, 300);
      } catch (err) {
        alert("Erreur accès caméra : " + err);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    function takePhoto() {
      const ctx = (step === 1 ? photoLeft : photoRight).getContext('2d');
      const w = camera.videoWidth;
      const h = camera.videoHeight;
      (step === 1 ? photoLeft : photoRight).width = w;
      (step === 1 ? photoLeft : photoRight).height = h;
      ctx.drawImage(camera, 0, 0);

      // vibration + flash
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }
      triggerFlash();
          
      if (step === 1) {
        step = 2;
        stepTitle.textContent = "Photo droite";
      } else {
        leftImgData  = photoLeft.getContext('2d').getImageData(0, 0, photoLeft.width,  photoLeft.height);
        rightImgData = photoRight.getContext('2d').getImageData(0, 0, photoRight.width, photoRight.height);

        //camera.classList.add('hidden'); 
        //gridCanvas.classList.add('hidden');
        showAnaglyphControls()
        renderAnaglyph();
        /*slider.classList.remove('hidden');
        offsetLabel.classList.remove('hidden');
        offsetYLabel.classList.remove('hidden');
        offsetYSlider.classList.remove('hidden');
        rotationLabel.classList.remove('hidden');
        rotationSlider.classList.remove('hidden');
        resetBtn.classList.remove('hidden');*/
        /*offsetPanel.classList.remove('hidden');
        invertBtn.classList.remove('hidden');
        downloadBtn.classList.remove('hidden');
        captureBtn.classList.add('hidden');
        gridBtn.classList.add('hidden');
        stepTitle.textContent = "Aperçu 3D";*/
      }
    }

	function importPhotos() {
	  const input = document.getElementById('photoInput');
	  input.click();

	  input.onchange = async () => {
		if (input.files.length !== 2) {
		  alert("Veuillez sélectionner exactement 2 photos !");
		  return;
		}

		// Charger les deux images
		const [img1, img2] = await Promise.all(
		  Array.from(input.files).map(file => loadImage(file))
		);

		// Dessiner les deux images dans les canvas
		drawToCanvas(photoLeft, img1);
		drawToCanvas(photoRight, img2);

		// Stocker leurs données
		leftImgData  = photoLeft.getContext('2d').getImageData(0, 0, photoLeft.width,  photoLeft.height);
		rightImgData = photoRight.getContext('2d').getImageData(0, 0, photoRight.width, photoRight.height);

		// Afficher les contrôles + l'anaglyphe
		//alert("1");
		home.classList.add('hidden');
		cameraPage.classList.remove('hidden');
		showAnaglyphControls();
		renderAnaglyph();
	  };
	}

	// Fonction pour charger une image depuis un fichier
	function loadImage(file) {
	  return new Promise(resolve => {
		const img = new Image();
		img.onload = () => resolve(img);
		img.src = URL.createObjectURL(file);
	  });
	}

	// Dessiner une image dans un canvas
	function drawToCanvas(canvas, img) {
	  canvas.width = img.width;
	  canvas.height = img.height;
	  canvas.getContext('2d').drawImage(img, 0, 0);
	}

	function showAnaglyphControls() {
	  camera.classList.add('hidden');
	  gridCanvas.classList.add('hidden');

	  /*[offsetLabel, offsetYLabel, rotationLabel,
	   slider, offsetYSlider, rotationSlider,
	   invertBtn, downloadBtn, resetBtn, saveSourcesBtn].forEach(el => el.classList.remove('hidden'));*/
      offsetPanel.classList.remove('hidden');
    
	  captureBtn.classList.add('hidden');
	  gridBtn.classList.add('hidden');
	  stepTitle.textContent = "Aperçu 3D";
	}


    function resetTransform() {
      slider.value = 0;
      offsetYSlider.value = 0;
      rotationSlider.value = 0;
    
      offset = 0;
      offsetY = 0;
      rotation = 0;
    
      offsetValue.textContent = 0;
      offsetYValue.textContent = 0;
      rotationValue.textContent = 0;
    
      renderAnaglyph();
    }

    function renderAnaglyph() {
	  if (!leftImgData || !rightImgData) return;
	
	  const w = leftImgData.width;
	  const h = leftImgData.height;
	
	  // Convertir % en pixels
	  const offsetPx = Math.round((offset / 100) * w);
	  const offsetYPx = Math.round((offsetY / 100) * h);
	
	  // Canvas temporaire
	  const tempCanvas = document.createElement('canvas');
	  tempCanvas.width = w;
	  tempCanvas.height = h;
	  const tempCtx = tempCanvas.getContext('2d');
	
	  tempCtx.translate(w / 2, h / 2);
	  tempCtx.rotate(rotation * Math.PI / 180);
	  tempCtx.translate(-w / 2 + offsetPx, -h / 2 + offsetYPx);
	
	  const rightCanvas = document.createElement('canvas');
	  rightCanvas.width = w;
	  rightCanvas.height = h;
	  rightCanvas.getContext('2d').putImageData(rightImgData, 0, 0);
	  tempCtx.drawImage(rightCanvas, 0, 0);
	
	  const Rtrans = tempCtx.getImageData(0, 0, w, h).data;
	  const out = new Uint8ClampedArray(w * h * 4);
	  const L = leftImgData.data, R = Rtrans;
	
	  for (let i = 0; i < w * h; i++) {
	    const p = i * 4;
	    const redSrc = invert ? R : L;
	    const cyanSrc = invert ? L : R;
	    out[p]   = redSrc[p];
	    out[p+1] = cyanSrc[p+1];
	    out[p+2] = cyanSrc[p+2];
	    out[p+3] = 255;
	  }
	
	  const ctx = anaglyphCanvas.getContext('2d');
	  anaglyphCanvas.width = w;
	  anaglyphCanvas.height = h;
	  ctx.putImageData(new ImageData(out, w, h), 0, 0);
	  anaglyphCanvas.classList.remove('hidden');
	}

	function nudge(type, delta) {
	  if (type === 'x') {
	    slider.value = Math.min(slider.max, Math.max(slider.min, parseInt(slider.value) + delta));
	  } else if (type === 'y') {
	    offsetYSlider.value = Math.min(offsetYSlider.max, Math.max(offsetYSlider.min, parseInt(offsetYSlider.value) + delta));
	  } else if (type === 'r') {
	    rotationSlider.value = Math.min(rotationSlider.max, Math.max(rotationSlider.min, parseInt(rotationSlider.value) + delta));
	  }
	  updateAnaglyph();
	}


    function updateAnaglyph() {
	  offset = parseInt(slider.value, 10);   // en %
	  offsetY = parseInt(offsetYSlider.value, 10); // en %
	  rotation = parseInt(rotationSlider.value, 10);
	
	  offsetValue.textContent = offset;
	  offsetYValue.textContent = offsetY;
	  rotationValue.textContent = rotation;
	
	  renderAnaglyph();
	}



    function invertChannels() {
      invert = !invert;
      renderAnaglyph();
    }

    function toggleGrid() {
      showGrid = !showGrid;
      if (showGrid) {
        gridCanvas.width = camera.videoWidth;
        gridCanvas.height = camera.videoHeight;
        gridCanvas.classList.remove('hidden');
        drawGrid();
      } else {
        gridCanvas.classList.add('hidden');
      }
    }

    function drawGrid() {
      if (!showGrid) return;
      const ctx = gridCanvas.getContext('2d');
      const w = gridCanvas.width;
      const h = gridCanvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        const x = (w / 3) * i;
        const y = (h / 3) * i;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
        ctx.moveTo(0, y); ctx.lineTo(w, y);
        ctx.stroke();
      }
      requestAnimationFrame(drawGrid);
    }

    function downloadAnaglyph() {
      const link = document.createElement('a');
      link.download = 'anaglyphe3D.png';
      link.href = anaglyphCanvas.toDataURL();
      link.click();
    }
	
	function downloadSources1() {
	  if (!photoLeft.width) return;

	  const link1 = document.createElement('a');
	  link1.download = 'photo_gauche.png';
	  link1.href = photoLeft.toDataURL();
	  link1.click();
	}
	function downloadSources2() {
		if (!photoRight.width) return;
		
		const link2 = document.createElement('a');
		link2.download = 'photo_droite.png';
		link2.href = photoRight.toDataURL();
		link2.click();
	}

	// Retourne un canvas de w×h contenant l'image droite transformée (offset%, offsetY%, rotation)
	function getTransformedRightCanvas() {
	  if (!rightImgData) return null;
	
	  const w = rightImgData.width, h = rightImgData.height;
	
	  // % -> px
	  const offsetPx  = Math.round((offset  / 100) * w);
	  const offsetYPx = Math.round((offsetY / 100) * h);
	
	  const tempCanvas = document.createElement('canvas');
	  tempCanvas.width = w;
	  tempCanvas.height = h;
	  const tempCtx = tempCanvas.getContext('2d');
	
	  // Appliquer les mêmes transfos que dans renderAnaglyph()
	  tempCtx.translate(w / 2, h / 2);
	  tempCtx.rotate(rotation * Math.PI / 180);
	  tempCtx.translate(-w / 2 + offsetPx, -h / 2 + offsetYPx);
	
	  // Dessiner l'image droite d'origine
	  const rightCanvas = document.createElement('canvas');
	  rightCanvas.width = w; rightCanvas.height = h;
	  rightCanvas.getContext('2d').putImageData(rightImgData, 0, 0);
	  tempCtx.drawImage(rightCanvas, 0, 0);
	
	  return tempCanvas;
	}
	
	// Trouve le bounding box des pixels non transparents (alpha > 0) d'un ImageData
	function getOpaqueBounds(imgData, w, h) {
	  const data = imgData.data;
	  let xMin = w, yMin = h, xMax = -1, yMax = -1;
	
	  // Parcours complet pour rester fiable (tu peux échantillonner si besoin de perf)
	  for (let y = 0; y < h; y++) {
	    for (let x = 0; x < w; x++) {
	      const a = data[(y * w + x) * 4 + 3];
	      if (a > 0) {
	        if (x < xMin) xMin = x;
	        if (x > xMax) xMax = x;
	        if (y < yMin) yMin = y;
	        if (y > yMax) yMax = y;
	      }
	    }
	  }
	  if (xMax === -1) return null; // rien de dessiné
	  // +1 pour passer de coordonnées inclusives à largeur/hauteur
	  return { x: xMin, y: yMin, w: xMax - xMin + 1, h: yMax - yMin + 1 };
	}
	
	// ---- Nouveau crop fiable ----
	function cropAndDownload() {
	  if (!leftImgData || !rightImgData) return;
	
	  // S'assurer que l'anaglyphe correspond bien aux valeurs actuelles
	  renderAnaglyph();
	
	  const w = leftImgData.width, h = leftImgData.height;
	
	  // 1) Recalculer l'image droite transformée
	  const transformed = getTransformedRightCanvas();
	  if (!transformed) return;
	
	  // 2) Déterminer la zone couverte par l'image transformée (alpha > 0)
	  const tCtx = transformed.getContext('2d');
	  const tData = tCtx.getImageData(0, 0, w, h);
	  const bbox = getOpaqueBounds(tData, w, h);
	
	  if (!bbox || bbox.w <= 0 || bbox.h <= 0) {
	    alert("Pas de zone superposée détectée !");
	    return;
	  }
	
	  // 3) Intersecter avec les limites de la gauche (qui est plein cadre)
	  const x = Math.max(0, bbox.x);
	  const y = Math.max(0, bbox.y);
	  const x2 = Math.min(w, bbox.x + bbox.w);
	  const y2 = Math.min(h, bbox.y + bbox.h);
	  const cw = x2 - x;
	  const ch = y2 - y;
	
	  if (cw <= 0 || ch <= 0) {
	    alert("Zone superposée trop petite ou hors cadre.");
	    return;
	  }
	
	  // 4) Recadrer depuis l’anaglyphe existant
	  const out = document.createElement('canvas');
	  out.width = cw; out.height = ch;
	  out.getContext('2d').drawImage(anaglyphCanvas, x, y, cw, ch, 0, 0, cw, ch);
	
	  // 5) Télécharger
	  const a = document.createElement('a');
	  a.download = 'anaglyphe_crop.png';
	  a.href = out.toDataURL();
	  a.click();
	}

	
	// Créer canvas final recadré
	const finalCanvas = document.createElement('canvas');
	finalCanvas.width = cropWidth;
	finalCanvas.height = cropHeight;
	const finalCtx = finalCanvas.getContext('2d');
	
	// Dessiner depuis l’anaglyphe existant
	finalCtx.drawImage(anaglyphCanvas, xMin, yMin, cropWidth, cropHeight,
									  0, 0, cropWidth, cropHeight);
	
	// Télécharger
	const link = document.createElement('a');
	link.download = 'anaglyphe_crop.png';
	link.href = finalCanvas.toDataURL();
	link.click();
	}


    // Swipe vertical pour changer de caméra
    camera.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    });

    camera.addEventListener('touchend', (e) => {
      let endY = e.changedTouches[0].clientY;
      let diff = endY - startY;

      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          currentCam = (currentCam + 1) % cameras.length;
        } else {
          currentCam = (currentCam - 1 + cameras.length) % cameras.length;
        }
        startCamera(cameras[currentCam].deviceId);
      }
    });
  </script>
</body>
</html>
