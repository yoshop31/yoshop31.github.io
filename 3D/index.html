<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Anaglyphe 3D</title>
  <style>
    .hidden { display: none; }
    .content { text-align: center; margin-top: 20px; }
    video, canvas { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; }
    button, input[type=range] { margin: 10px; padding: 10px 15px; font-size: 16px; }
    .fade-out { opacity: 0; transition: opacity 0.3s ease-in-out; }
    .fade-in { opacity: 1; transition: opacity 0.3s ease-in-out; }
  </style>
</head>
<body>
  <div id="home" class="content">
    <h1>Photo → Anaglyphe 3D</h1>
    <button onclick="openCamera()">Prendre les 2 photos</button>
  </div>

  <div id="cameraPage" class="content hidden">
    <h2 id="stepTitle">Photo gauche</h2>
    <video id="camera" autoplay playsinline class="fade-in"></video>
    <canvas id="photoLeft" class="hidden"></canvas>
    <canvas id="photoRight" class="hidden"></canvas>
    <canvas id="anaglyphCanvas" class="hidden"></canvas>
    <br>
    <label id="offsetLabel" class="hidden">Décalage: <span id="offsetValue">5</span> px</label>
    <input type="range" id="offsetSlider" min="0" max="20" value="5" class="hidden" oninput="updateAnaglyph()">
    <br>
    <button id="captureBtn" onclick="takePhoto()">Prendre</button>
    <button onclick="downloadAnaglyph()">Télécharger</button>
    <button onclick="backHome()">Retour</button>
  </div>

  <script>
    const home = document.getElementById('home');
    const cameraPage = document.getElementById('cameraPage');
    const camera = document.getElementById('camera');
    const photoLeft = document.getElementById('photoLeft');
    const photoRight = document.getElementById('photoRight');
    const anaglyphCanvas = document.getElementById('anaglyphCanvas');
    const slider = document.getElementById('offsetSlider');
    const offsetLabel = document.getElementById('offsetLabel');
    const offsetValue = document.getElementById('offsetValue');
    const stepTitle = document.getElementById('stepTitle');

    let stream = null;
    let cameras = [];
    let currentCam = 0;
    let startY = 0;
    let offset = 5;
    let step = 1; // 1 = gauche, 2 = droite
    let leftImgData = null, rightImgData = null;

    async function openCamera() {
      home.classList.add('hidden');
      cameraPage.classList.remove('hidden');
      await loadCameras();
      startCamera(cameras[currentCam]?.deviceId);
      step = 1;
      stepTitle.textContent = "Photo gauche";
    }

    function backHome() {
      stopCamera();
      cameraPage.classList.add('hidden');
      home.classList.remove('hidden');
      anaglyphCanvas.classList.add('hidden');
      slider.classList.add('hidden');
      offsetLabel.classList.add('hidden');
      step = 1;
    }

    async function loadCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      cameras = devices.filter(d => d.kind === 'videoinput');
      const backCamIndex = cameras.findIndex(c => c.label.toLowerCase().includes('back'));
      if (backCamIndex >= 0) currentCam = backCamIndex;
    }

    async function startCamera(deviceId) {
      if (stream) stopCamera();
      try {
        camera.classList.add('fade-out');
        setTimeout(async () => {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: deviceId } }
          });
          camera.srcObject = stream;
          camera.classList.remove('fade-out');
          camera.classList.add('fade-in');
          camera.classList.remove('hidden');
          anaglyphCanvas.classList.add('hidden');
          slider.classList.add('hidden');
          offsetLabel.classList.add('hidden');
        }, 300);
      } catch (err) {
        alert("Erreur accès caméra : " + err);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    function takePhoto() {
      const ctx = (step === 1 ? photoLeft : photoRight).getContext('2d');
      const w = camera.videoWidth;
      const h = camera.videoHeight;
      (step === 1 ? photoLeft : photoRight).width = w;
      (step === 1 ? photoLeft : photoRight).height = h;
      ctx.drawImage(camera, 0, 0);

      if (step === 1) {
        step = 2;
        stepTitle.textContent = "Photo droite";
      } else {
        leftImgData  = photoLeft.getContext('2d').getImageData(0, 0, photoLeft.width,  photoLeft.height);
        rightImgData = photoRight.getContext('2d').getImageData(0, 0, photoRight.width, photoRight.height);

        renderAnaglyph();
        slider.classList.remove('hidden');
        offsetLabel.classList.remove('hidden');
        stepTitle.textContent = "Aperçu 3D";
      }
    }

    function renderAnaglyph() {
      if (!leftImgData || !rightImgData) return;

      const w = leftImgData.width;
      const h = leftImgData.height;
      const L = leftImgData.data;
      const R = rightImgData.data;
      const out = new Uint8ClampedArray(w * h * 4);
      const off = offset | 0;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idxOut = (y * w + x) * 4;

          const lx = x + off;
          const rx = x - off;

          // Rouge depuis gauche
          if (lx >= 0 && lx < w) {
            const idxL = (y * w + lx) * 4;
            out[idxOut] = L[idxL];
          } else {
            out[idxOut] = 0;
          }

          // Vert + Bleu depuis droite
          if (rx >= 0 && rx < w) {
            const idxR = (y * w + rx) * 4;
            out[idxOut + 1] = R[idxR + 1];
            out[idxOut + 2] = R[idxR + 2];
          } else {
            out[idxOut + 1] = 0;
            out[idxOut + 2] = 0;
          }

          out[idxOut + 3] = 255;
        }
      }

      const ctx = anaglyphCanvas.getContext('2d');
      anaglyphCanvas.width = w;
      anaglyphCanvas.height = h;
      ctx.putImageData(new ImageData(out, w, h), 0, 0);
      anaglyphCanvas.classList.remove('hidden');
    }

    function updateAnaglyph() {
      offset = parseInt(slider.value, 10);
      offsetValue.textContent = offset;
      renderAnaglyph();
    }

    function downloadAnaglyph() {
      const link = document.createElement('a');
      link.download = 'anaglyphe3D.png';
      link.href = anaglyphCanvas.toDataURL();
      link.click();
    }

    // Swipe vertical pour changer de caméra
    camera.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    });

    camera.addEventListener('touchend', (e) => {
      let endY = e.changedTouches[0].clientY;
      let diff = endY - startY;

      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          currentCam = (currentCam + 1) % cameras.length;
        } else {
          currentCam = (currentCam - 1 + cameras.length) % cameras.length;
        }
        startCamera(cameras[currentCam].deviceId);
      }
    });
  </script>
</body>
</html>
