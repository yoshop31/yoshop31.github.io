<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15231f">
  <meta name="description" content="Jeu de placement tactique à deux joueurs sur le même appareil.">
  <title>Strategeti — jeu à deux</title>
  <link rel="icon" type="image/png" href="img/fav_icon.png">
  <link rel="manifest" href="pwa-manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Strategeti, accueil">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Strategeti</span>
      </a>
      <nav class="menu" aria-label="Menu de partie">
        <button class="button button-quiet" id="new-game-button" type="button">Nouvelle partie</button>
        <button class="button button-quiet" id="restart-button" type="button" hidden>Recommencer</button>
      </nav>
    </header>

    <section class="setup-panel panel" id="setup-panel" aria-labelledby="setup-title">
      <p class="eyebrow">Jeu à deux · même appareil</p>
      <h1 id="setup-title">Prêts à jouer ?</h1>
      <p class="muted">Choisissez un plateau pour commencer. Votre partie est sauvegardée automatiquement sur cet appareil.</p>
      <form id="new-game-form" class="setup-form">
        <label for="board-choice">Plateau</label>
        <select id="board-choice" name="board">
          <option value="savanna-4x4">Savane · 4 × 4</option>
        </select>
        <button class="button button-primary" type="submit">Démarrer la partie</button>
      </form>
      <button class="button button-quiet resume-button" id="resume-button" type="button" hidden>Revenir à la partie</button>
    </section>

    <section id="game-panel" class="game-panel" aria-label="Partie" hidden>
      <div class="game-heading">
        <div>
          <p class="eyebrow">Savane · 4 × 4</p>
          <h1>La savane</h1>
        </div>
        <div class="turn-indicator" id="turn-indicator" role="status" aria-live="polite"></div>
      </div>

      <section class="player-zone player-black" aria-labelledby="black-title">
        <div class="player-heading">
          <span class="player-stone stone-black" aria-hidden="true"></span>
          <h2 id="black-title">Noir <span class="player-position">— en haut</span></h2>
          <span class="stock-label" id="black-stock-label"></span>
        </div>
        <div class="stock" id="black-stock" aria-label="Stock des pièces noires"></div>
      </section>

      <div class="board-wrap">
        <div class="board" id="game-board" role="grid" aria-label="Plateau de jeu 4 par 4"></div>
      </div>

      <section class="player-zone player-white" aria-labelledby="white-title">
        <div class="player-heading">
          <span class="player-stone stone-white" aria-hidden="true"></span>
          <h2 id="white-title">Blanc <span class="player-position">— en bas</span></h2>
          <span class="stock-label" id="white-stock-label"></span>
        </div>
        <div class="stock" id="white-stock" aria-label="Stock des pièces blanches"></div>
      </section>
      <p class="game-message" id="game-message" aria-live="polite"></p>
    </section>

    <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">Recommencer la partie ?</h2>
      <p id="confirm-message">La progression actuelle sera remplacée.</p>
      <div class="dialog-actions">
        <button class="button button-quiet" value="cancel">Annuler</button>
        <button class="button button-danger" id="confirm-action" value="confirm">Recommencer</button>
      </div>
    </form>
  </dialog>
</body>
</html>
