<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsUmq3deIubPMgKpe5Kslrod0caf5FlbE&libraries=places&language=fr"></script>
<script>
let map, marker, target = null;
let watchId = null;
let deviceHeading = null;
let currentPos = null;
let currentAccuracy = null;
let selecting = false;

const statusEl = () => document.getElementById('status');
const arrowEl = () => document.getElementById('arrow');
const distanceEl = () => document.getElementById('distance');
const precisionFillEl = () => document.getElementById('precision-fill');

function initMapOnceReady() {
	const defaultPos = { lat: 48.8566, lng: 2.3522 };
	map = new google.maps.Map(document.getElementById('map'), {
		center: defaultPos,
		zoom: 13,
		mapTypeControl: false
	});
	marker = new google.maps.Marker({ map, draggable: false });
	const input = document.getElementById('search-input');
	const ac = new google.maps.places.Autocomplete(input, { fields: ['geometry','formatted_address','name'] });
	ac.addListener('place_changed', () => {
		const place = ac.getPlace();
		if (!place.geometry) return;
		const loc = place.geometry.location;
		setTarget({ lat: loc.lat(), lng: loc.lng() }, place.formatted_address || place.name);
		map.panTo(loc);
		map.setZoom(16);
	});
	map.addListener('click', (e) => {
		if (!selecting) return;
		setTarget({ lat: e.latLng.lat(), lng: e.latLng.lng() }, 'Point choisi');
		selecting = false;
		document.getElementById('select-btn').textContent = 'Sélectionner sur la carte';
	});
}

function setTarget(latlng, label) {
	target = latlng;
	marker.setPosition(latlng);
	marker.setMap(map);
	statusEl().textContent = `Cible : ${label || ''} (${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)})`;
	updateArrow();
}

function startPositionWatch() {
	if (!('geolocation' in navigator)) { statusEl().textContent = 'Géo non supportée'; return; }
	watchId = navigator.geolocation.watchPosition(pos => {
		currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
		currentAccuracy = pos.coords.accuracy;
		updateArrow();
	}, err => {
		statusEl().textContent = 'Erreur position: ' + err.message;
	}, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
}

function stopPositionWatch() {
	if (watchId !== null) navigator.geolocation.clearWatch(watchId);
}

function requestDeviceOrientationPermissionIfNeeded() {
	if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
		DeviceOrientationEvent.requestPermission().then(resp => {
			if (resp === 'granted') attachOrientation(); else statusEl().textContent = 'Permission boussole refusée';
		}).catch(e => statusEl().textContent = 'boussole: ' + e);
	} else {
		attachOrientation();
	}
}

function attachOrientation() {
	window.addEventListener('deviceorientationabsolute', handleOrientation, true);
	window.addEventListener('deviceorientation', handleOrientation, true);
}

function handleOrientation(e) {
	let alpha = null;
	if (e.absolute && typeof e.alpha === 'number') alpha = e.alpha;
	else if (typeof e.webkitCompassHeading === 'number') alpha = e.webkitCompassHeading;
	else if (typeof e.alpha === 'number') alpha = e.alpha;
	if (alpha === null) return;
	deviceHeading = 360 - alpha;
	updateArrow();
}

function toRad(d){return d*Math.PI/180}
function toDeg(r){return r*180/Math.PI}

function bearingBetween(start, end){
	const lat1 = toRad(start.lat), lat2 = toRad(end.lat);
	const dLon = toRad(end.lng - start.lng);
	const y = Math.sin(dLon)*Math.cos(lat2);
	const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
	let brng = toDeg(Math.atan2(y,x));
	brng = (brng + 360) % 360;
	return brng;
}

function distanceBetween(start, end){
	const R = 6371e3;
	const φ1 = toRad(start.lat), φ2 = toRad(end.lat);
	const Δφ = toRad(end.lat-start.lat);
	const Δλ = toRad(end.lng-start.lng);
	const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
	const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
	return R*c;
}

function updateArrow() {
	const aEl = arrowEl();
	if (!aEl) return;
	if (!target) { aEl.style.opacity = '0.25'; return; }
	if (!currentPos) { aEl.style.opacity = '0.6'; statusEl().textContent = 'Cible définie — attente position GPS...'; return; }
	const brng = bearingBetween(currentPos, target);
	let angleToRotate = brng;
	if (deviceHeading !== null) {
		angleToRotate = (brng - deviceHeading + 360) % 360;
	}
	aEl.style.opacity = '1';
	aEl.style.transform = `rotate(${angleToRotate}deg)`;
	distanceEl().textContent = `Distance : ${Math.round(distanceBetween(currentPos,target))} m`;
	if (currentAccuracy !== null) {
		let perc = Math.max(0, Math.min(1, 100/currentAccuracy));
		precisionFillEl().style.width = (perc*100)+"%";
	}
}

window.addEventListener('load', () => {
	const interval = setInterval(() => { if (window.google && google.maps) { clearInterval(interval); initMapOnceReady(); } }, 200);
	document.getElementById('select-btn').addEventListener('click', (e) => {
		selecting = !selecting;
		e.target.textContent = selecting ? 'Cliquez sur la carte...' : 'Sélectionner sur la carte';
	});
	document.getElementById('locate').addEventListener('click', () => {
		if (currentPos) map.panTo(currentPos);
	});
	startPositionWatch();
	document.getElementById('search-input').addEventListener('focus', requestDeviceOrientationPermissionIfNeeded, { once: true });
	document.getElementById('select-btn').addEventListener('click', requestDeviceOrientationPermissionIfNeeded, { once: true });
});

	
	
	</script>

  
</body>
